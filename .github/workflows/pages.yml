name: Dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 13 * * 6"  # Saturdays, after the week's NSE close
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false  # never cut off a deploy halfway
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/fetch_data.py
      - run: uv run python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  keepalive:
    # GitHub disables scheduled workflows in public repos after 60 days without
    # repository activity. Re-enabling this workflow through the API on each
    # scheduled run keeps the refresh going without adding commits.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
